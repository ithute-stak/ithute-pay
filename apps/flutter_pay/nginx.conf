server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Narrow, read-only backend probe for the Flutter web UI.
    # Deliberately does not proxy auth, tokens, wallet, payments, or API mutations.
    location = /service-health {
        limit_except GET { deny all; }
        proxy_pass http://ithute-pay-ithute-pay-bridge-1:8001/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_set_header Host api.pay.ithute.co.ls;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
