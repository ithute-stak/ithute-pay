name: M-Pesa pass-through Alembic migration

on:
  pull_request:
    paths:
      - 'apps/backend/alembic/versions/0015_mpesa_pass_through_state.py'
      - 'apps/backend/tests/test_mpesa_pass_through_migration.py'
      - '.github/workflows/mpesa-pass-through-migration.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/alembic/versions/0015_mpesa_pass_through_state.py'
      - 'apps/backend/tests/test_mpesa_pass_through_migration.py'
      - '.github/workflows/mpesa-pass-through-migration.yml'

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated migration dependencies
        run: python -m pip install 'pytest>=8,<10' 'sqlalchemy>=2,<3' 'alembic>=1.13,<2'
      - name: Check frozen migration constraints and reversible DDL
        working-directory: apps/backend
        env:
          PYTHONPATH: .
        run: python -m pytest --noconftest -q tests/test_mpesa_pass_through_migration.py
