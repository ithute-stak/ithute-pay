name: Golink Phase 4 regression
on:
  pull_request:
    paths:
      - 'apps/backend/providers/golink/**'
      - 'apps/backend/tests/test_golink_*.py'
      - 'apps/backend/workers/golink_reconciliation.py'
      - 'apps/backend/workers/tasks.py'
      - '.github/workflows/golink-phase4-tests.yml'
  workflow_dispatch:

jobs:
  golink-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend and tests
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          dependencies = project["project"]["dependencies"]
          dev_dependencies = project["project"]["optional-dependencies"]["dev"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies, *dev_dependencies])
          PY
      - name: Golink regression tests
        run: python -m pytest -q tests/test_golink_*.py
