name: Golink Phase 4 regression
on:
  pull_request:
    paths:
      - 'apps/backend/providers/golink/**'
      - 'apps/backend/integrations/registry.py'
      - 'apps/backend/integrations/rail_routing_policy.py'
      - 'apps/backend/integrations/rail_routing_settings.py'
      - 'apps/backend/integrations/rail_routing_changes.py'
      - 'apps/backend/integrations/rail_routing_audit.py'
      - 'apps/backend/integrations/rail_routing_review.py'
      - 'apps/backend/integrations/rail_routing_activation.py'
      - 'apps/backend/providers/mpesa/factory.py'
      - 'apps/backend/providers/ecocash/factory.py'
      - 'docs/GOLINK_*.md'
      - 'apps/backend/tests/test_golink_*.py'
      - 'apps/backend/scripts/sql/rail_routing_review_unique_postgres.sql'
      - 'apps/backend/workers/golink_reconciliation.py'
      - 'apps/backend/workers/tasks.py'
      - '.github/workflows/golink-phase4-tests.yml'
  workflow_dispatch:

jobs:
  golink-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend and tests
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          dependencies = project["project"]["dependencies"]
          dev_dependencies = project["project"]["optional-dependencies"]["dev"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies, *dev_dependencies])
          PY
      - name: Compile Golink Python modules and tests
        run: |
          python -m compileall -q providers/golink integrations/rail_routing_policy.py integrations/rail_routing_settings.py integrations/rail_routing_changes.py integrations/rail_routing_audit.py integrations/rail_routing_review.py integrations/rail_routing_activation.py tests/test_golink_*.py workers/golink_reconciliation.py
      - name: Golink regression tests
        run: |
          # The test database must always be created fresh in CI.
          rm -f tests/paybridge_test.db tests/paybridge_test.db-wal tests/paybridge_test.db-shm
          python -m pytest -q tests/test_golink_*.py

  golink-postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: golink_test
          POSTGRES_PASSWORD: golink_test_password
          POSTGRES_DB: golink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U golink_test -d golink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      GOLINK_PG_CONCURRENCY_TEST: "true"
      DATABASE_URL: postgresql+psycopg://golink_test:golink_test_password@localhost:5432/golink_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend and tests
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())
          requirements = project["project"]["dependencies"] + project["project"]["optional-dependencies"]["dev"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY
      - name: Concurrent webhook reconciliation on PostgreSQL
        run: python -m pytest -q tests/test_golink_terminal_replays.py tests/test_golink_routing_review_concurrency.py tests/test_golink_routing_review_unique.py -k 'postgres_two_workers or postgres_two_administrators or postgres_unique_review_index'
