name: M-Pesa pass-through notification draft outbox

on:
  pull_request:
    paths:
      - 'apps/backend/database/models/mpesa_pass_through_notification.py'
      - 'apps/backend/services/mpesa_pass_through_notifications.py'
      - 'apps/backend/tests/test_mpesa_pass_through_notifications.py'
      - 'apps/backend/alembic/versions/0019_mpesa_pt_notice_drafts.py'
      - '.github/workflows/mpesa-pass-through-notifications.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/database/models/mpesa_pass_through_notification.py'
      - 'apps/backend/services/mpesa_pass_through_notifications.py'
      - 'apps/backend/tests/test_mpesa_pass_through_notifications.py'
      - 'apps/backend/alembic/versions/0019_mpesa_pt_notice_drafts.py'
      - '.github/workflows/mpesa-pass-through-notifications.yml'

permissions:
  contents: read

jobs:
  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: apps/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Reset disposable SQLite database
        working-directory: apps/backend
        run: rm -f tests/paybridge_test.db tests/paybridge_test.db-wal tests/paybridge_test.db-shm
      - name: Test non-deliverable notification draft outbox
        working-directory: apps/backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_mpesa_pass_through_notifications.py
