name: M-Pesa pass-through operation outbox

on:
  pull_request:
    paths:
      - 'apps/backend/database/models/mpesa_pass_through_outbox.py'
      - 'apps/backend/services/mpesa_pass_through_outbox.py'
      - 'apps/backend/tests/test_mpesa_pass_through_outbox.py'
      - 'apps/backend/alembic/versions/0016_mpesa_pt_operation_intents.py'
      - '.github/workflows/mpesa-pass-through-outbox.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/database/models/mpesa_pass_through_outbox.py'
      - 'apps/backend/services/mpesa_pass_through_outbox.py'
      - 'apps/backend/tests/test_mpesa_pass_through_outbox.py'
      - 'apps/backend/alembic/versions/0016_mpesa_pt_operation_intents.py'
      - '.github/workflows/mpesa-pass-through-outbox.yml'

permissions:
  contents: read

jobs:
  outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend tests
        working-directory: apps/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Reset dedicated disposable SQLite database
        working-directory: apps/backend
        run: rm -f tests/paybridge_test.db tests/paybridge_test.db-wal tests/paybridge_test.db-shm
      - name: Test non-executing outbox invariants
        working-directory: apps/backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_mpesa_pass_through_outbox.py
