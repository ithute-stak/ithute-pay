name: M-Pesa pass-through persisted monitor history

on:
  pull_request:
    paths:
      - 'apps/backend/database/models/mpesa_pt_monitor_history.py'
      - 'apps/backend/database/models/__init__.py'
      - 'apps/backend/alembic/versions/0020_mpesa_pt_monitor_history.py'
      - 'apps/backend/services/mpesa_pt_monitor_history.py'
      - 'apps/backend/scripts/mpesa_pt_monitor_once.py'
      - 'apps/backend/routers/mpesa_pass_through_operations.py'
      - 'apps/backend/tests/test_mpesa_pt_monitor_history.py'
      - '.github/workflows/mpesa-pt-monitor-history.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/database/models/mpesa_pt_monitor_history.py'
      - 'apps/backend/database/models/__init__.py'
      - 'apps/backend/alembic/versions/0020_mpesa_pt_monitor_history.py'
      - 'apps/backend/services/mpesa_pt_monitor_history.py'
      - 'apps/backend/scripts/mpesa_pt_monitor_once.py'
      - 'apps/backend/routers/mpesa_pass_through_operations.py'
      - 'apps/backend/tests/test_mpesa_pt_monitor_history.py'
      - '.github/workflows/mpesa-pt-monitor-history.yml'

permissions:
  contents: read

jobs:
  persisted-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: apps/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Reset disposable SQLite database
        working-directory: apps/backend
        run: rm -f tests/paybridge_test.db tests/paybridge_test.db-wal tests/paybridge_test.db-shm
      - name: Test persistent monitoring and read-only recovery
        working-directory: apps/backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_mpesa_pt_monitor_history.py \
            tests/test_mpesa_pass_through_monitor.py \
            tests/test_mpesa_pass_through_alert_operations.py \
            tests/test_mpesa_pass_through_operations_api.py
      - name: Scheduler is disabled without explicit enablement
        working-directory: apps/backend
        env:
          PYTHONPATH: .
        run: |
          if python scripts/mpesa_pt_monitor_once.py; then
            echo "Unsafe scheduler default" >&2
            exit 1
          fi
