name: M-Pesa pass-through exception review

on:
  pull_request:
    paths:
      - 'apps/backend/database/models/mpesa_pass_through_exception.py'
      - 'apps/backend/services/mpesa_pass_through_exceptions.py'
      - 'apps/backend/tests/test_mpesa_pass_through_exceptions.py'
      - 'apps/backend/alembic/versions/0018_mpesa_pt_exception_cases.py'
      - '.github/workflows/mpesa-pass-through-exceptions.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/database/models/mpesa_pass_through_exception.py'
      - 'apps/backend/services/mpesa_pass_through_exceptions.py'
      - 'apps/backend/tests/test_mpesa_pass_through_exceptions.py'
      - 'apps/backend/alembic/versions/0018_mpesa_pt_exception_cases.py'
      - '.github/workflows/mpesa-pass-through-exceptions.yml'

permissions:
  contents: read

jobs:
  exceptions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend requirements
        working-directory: apps/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Reset disposable database
        working-directory: apps/backend
        run: rm -f tests/paybridge_test.db tests/paybridge_test.db-wal tests/paybridge_test.db-shm
      - name: Test pass-through operator exceptions
        working-directory: apps/backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_mpesa_pass_through_exceptions.py
