name: M-Pesa pass-through operations API

on:
  pull_request:
    paths:
      - 'apps/backend/routers/mpesa_pass_through_operations.py'
      - 'apps/backend/api/v1/router.py'
      - 'apps/backend/tests/test_mpesa_pass_through_operations_api.py'
      - '.github/workflows/mpesa-pass-through-operations-api.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/routers/mpesa_pass_through_operations.py'
      - 'apps/backend/api/v1/router.py'
      - 'apps/backend/tests/test_mpesa_pass_through_operations_api.py'
      - '.github/workflows/mpesa-pass-through-operations-api.yml'

permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: apps/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Reset disposable SQLite test database
        working-directory: apps/backend
        run: rm -f tests/paybridge_test.db tests/paybridge_test.db-wal tests/paybridge_test.db-shm
      - name: Test authenticated operations HTTP API
        working-directory: apps/backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_mpesa_pass_through_operations_api.py
