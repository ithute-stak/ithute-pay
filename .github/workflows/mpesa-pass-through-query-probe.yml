name: M-Pesa pass-through sandbox query probe

on:
  pull_request:
    paths:
      - 'apps/backend/services/mpesa_pass_through_query_probe.py'
      - 'apps/backend/tests/test_mpesa_pass_through_query_probe.py'
      - '.github/workflows/mpesa-pass-through-query-probe.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/services/mpesa_pass_through_query_probe.py'
      - 'apps/backend/tests/test_mpesa_pass_through_query_probe.py'
      - '.github/workflows/mpesa-pass-through-query-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: apps/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Validate sandbox-only query adapter contract
        working-directory: apps/backend
        env:
          PYTHONPATH: .
        run: python -m pytest --noconftest -q tests/test_mpesa_pass_through_query_probe.py
