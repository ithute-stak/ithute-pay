name: M-Pesa pass-through read-only recovery monitoring

on:
  pull_request:
    paths:
      - 'apps/backend/services/mpesa_pass_through_monitor.py'
      - 'apps/backend/routers/mpesa_pass_through_operations.py'
      - 'apps/backend/tests/test_mpesa_pass_through_monitor.py'
      - '.github/workflows/mpesa-pass-through-monitor.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/services/mpesa_pass_through_monitor.py'
      - 'apps/backend/routers/mpesa_pass_through_operations.py'
      - 'apps/backend/tests/test_mpesa_pass_through_monitor.py'
      - '.github/workflows/mpesa-pass-through-monitor.yml'

permissions:
  contents: read

jobs:
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: apps/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Reset disposable SQLite database
        working-directory: apps/backend
        run: rm -f tests/paybridge_test.db tests/paybridge_test.db-wal tests/paybridge_test.db-shm
      - name: Test read-only monitoring and earlier operational APIs
        working-directory: apps/backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_mpesa_pass_through_monitor.py \
            tests/test_mpesa_pass_through_alert_operations.py \
            tests/test_mpesa_pass_through_operations_api.py \
            tests/test_mpesa_pass_through_recovery_inbox.py
