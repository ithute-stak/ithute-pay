name: M-Pesa pass-through readiness and recovery

on:
  pull_request:
    paths:
      - 'apps/backend/services/mpesa_pass_through_readiness.py'
      - 'apps/backend/tests/test_mpesa_pass_through_readiness.py'
      - '.github/workflows/mpesa-pass-through-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/services/mpesa_pass_through_readiness.py'
      - 'apps/backend/tests/test_mpesa_pass_through_readiness.py'
      - '.github/workflows/mpesa-pass-through-readiness.yml'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend requirements
        working-directory: apps/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Clean disposable SQLite test database
        working-directory: apps/backend
        run: rm -f tests/paybridge_test.db tests/paybridge_test.db-wal tests/paybridge_test.db-shm
      - name: Verify no-live-dispatch gate and recovery policies
        working-directory: apps/backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_mpesa_pass_through_readiness.py
