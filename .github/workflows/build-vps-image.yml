name: Build IthutePay VPS image

on:
  push:
    branches:
      - main
      - feature/golink-optional-adapter
    paths:
      - 'Dockerfile'
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'deploy/container/**'
      - 'deploy/nginx/**'
      - 'deploy/compose.public-edge.yml'
      - '.github/workflows/build-vps-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ithutepay-vps-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: image-tags
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ithute-stak/ithute-pay
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and publish commit and main-latest images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: ${{ steps.image-tags.outputs.labels }}
          build-args: |
            BACKEND_INTERNAL_URL=http://127.0.0.1:8001
            NEXT_PUBLIC_API_BASE=/api/v1
            NEXT_PUBLIC_PARTNER_API_BASE=https://api.pay.ithute.co.ls/api/v1
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Published image reference
        run: |
          echo "Published tags:"
          echo "${{ steps.image-tags.outputs.tags }}"
          echo "On main, pull ghcr.io/ithute-stak/ithute-pay:latest"
