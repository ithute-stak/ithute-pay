name: Build IthutePay VPS image

on:
  push:
    branches:
      - main
      - feature/golink-optional-adapter
    paths:
      - 'Dockerfile'
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'deploy/container/**'
      - 'deploy/nginx/**'
      - 'deploy/compose.public-edge.yml'
      - '.github/workflows/build-vps-image.yml'
      - '.github/workflows/financial-integrity.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'deploy/container/**'
      - 'deploy/staging/**'
      - '.github/workflows/build-vps-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ithutepay-vps-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  financial-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ithute_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: ithute_financial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ithute_test -d ithute_financial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_FINANCIAL_CONCURRENCY_TEST: 'true'
      GOLINK_PG_CONCURRENCY_TEST: 'true'
      DATABASE_URL: postgresql+psycopg://ithute_test:isolated_ci_password@127.0.0.1:5432/ithute_financial_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.txt pytest
      - name: Verify isolated PostgreSQL target
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          assert url.host in {"127.0.0.1", "localhost"}
          assert url.database == "ithute_financial_test"
          assert os.environ["PG_FINANCIAL_CONCURRENCY_TEST"] == "true"
          print("Disposable CI PostgreSQL database verified")
          PY
      - name: Refuse a skipped PostgreSQL concurrency suite
        working-directory: apps/backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          if url.get_backend_name() != "postgresql":
              raise SystemExit("Financial integrity CI must use PostgreSQL")
          # Check the disposable service directly without importing app settings,
          # which are intentionally initialized by pytest's conftest fixture.
          with create_engine(url, connect_args={"connect_timeout": 5}).connect() as connection:
              connection.execute(text("SELECT 1"))
          if os.environ.get("PG_FINANCIAL_CONCURRENCY_TEST") != "true":
              raise SystemExit("PostgreSQL financial concurrency tests must be enabled")
          if os.environ.get("GOLINK_PG_CONCURRENCY_TEST") != "true":
              raise SystemExit("PostgreSQL test session must be enabled")
          print("PostgreSQL financial concurrency suite enabled")
          PY
      - name: Execute financial concurrency tests
        working-directory: apps/backend
        run: |
          python -m pytest -vv -ra --tb=short --durations=10 --junitxml=financial-integrity-results.xml \
            tests/test_postgres_financial_concurrency.py \
            tests/test_financial_integrity_posting.py \
            tests/test_payment_lifecycle.py \
            tests/test_provider_operation_reservation.py \
            tests/test_merchant_payout_dispatch_claim.py \
            tests/test_collection_dispatch_claim.py \
            tests/test_reconciliation_terminal_state.py \
            tests/test_provider_operation_terminal_state.py \
            tests/test_callback_concurrency_contract.py \
            tests/test_payment_fault_injection.py
  build:
    needs: financial-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: image-tags
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ithute-stak/ithute-pay
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and publish commit and main-latest images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: ${{ steps.image-tags.outputs.labels }}
          build-args: |
            BACKEND_INTERNAL_URL=http://127.0.0.1:8001
            NEXT_PUBLIC_API_BASE=/api/v1
            NEXT_PUBLIC_PARTNER_API_BASE=${{ github.event_name == 'pull_request' && '/api/v1' || 'https://api.pay.ithute.co.ls/api/v1' }}
          # Docker local --load cannot export a multi-manifest attestation index.
          # Keep attestations enabled for registry-published images only.
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot PR image against isolated staging PostgreSQL and Redis
        if: github.event_name == 'pull_request'
        env:
          STAGING_IMAGE_TAG: ${{ steps.image-tags.outputs.version }}
          STAGING_DB_PASSWORD: ci_disposable_only_12345
        run: |
          set -euo pipefail
          export STAGING_IMAGE="ghcr.io/ithute-stak/ithute-pay:$STAGING_IMAGE_TAG"
          docker image inspect "$STAGING_IMAGE" >/dev/null
          STAGING_ENV_FILE="$(mktemp)"
          export STAGING_ENV_FILE
          chmod 600 "$STAGING_ENV_FILE"
          printf '%s\n' 'SECRET_KEY=ci-disposable-signing-secret-at-least-32-characters' > "$STAGING_ENV_FILE"
          cleanup() {
            docker compose -f deploy/staging/compose.yaml down --volumes --remove-orphans || true
            rm -f "$STAGING_ENV_FILE"
          }
          trap cleanup EXIT
          docker compose -f deploy/staging/compose.yaml config --quiet
          docker compose -f deploy/staging/compose.yaml up -d postgres redis
          docker compose -f deploy/staging/compose.yaml run --rm --no-deps \
            --workdir /app/backend --entrypoint python app -m alembic upgrade head
          docker compose -f deploy/staging/compose.yaml up -d app
          for attempt in $(seq 1 36); do
            if docker compose -f deploy/staging/compose.yaml exec -T app python /app/backend/scripts/staging_postdeploy_smoke.py --api-port 8001 --web-port 3001; then
              echo "Combined PR image passed isolated staging deployment smoke"
              exit 0
            fi
            sleep 5
          done
          docker compose -f deploy/staging/compose.yaml ps
          docker compose -f deploy/staging/compose.yaml logs --tail=60 app
          exit 1
      - name: Published image reference
        if: github.event_name != 'pull_request'
        run: |
          echo "Published tags:"
          echo "${{ steps.image-tags.outputs.tags }}"
          echo "On main, pull ghcr.io/ithute-stak/ithute-pay:latest"
