name: M-Pesa Phase 19 operator summary

on:
  pull_request:
    paths:
      - 'apps/backend/services/mpesa_pt_operator_summary.py'
      - 'apps/backend/routers/mpesa_pass_through_operations.py'
      - 'apps/backend/tests/test_mpesa_pt_operator_summary.py'
      - '.github/workflows/mpesa-pt-phase19-operator.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/services/mpesa_pt_operator_summary.py'
      - 'apps/backend/routers/mpesa_pass_through_operations.py'
      - 'apps/backend/tests/test_mpesa_pt_operator_summary.py'
      - '.github/workflows/mpesa-pt-phase19-operator.yml'

permissions:
  contents: read

jobs:
  operator-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and testing requirements
        run: |
          python -m pip install -r apps/backend/requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Reset disposable SQLite test database
        working-directory: apps/backend
        run: rm -f tests/paybridge_test.db tests/paybridge_test.db-wal tests/paybridge_test.db-shm
      - name: Test operator overview and prior monitoring controls
        working-directory: apps/backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_mpesa_pt_operator_summary.py \
            tests/test_mpesa_pt_monitor_history.py \
            tests/test_mpesa_pass_through_operations_api.py
