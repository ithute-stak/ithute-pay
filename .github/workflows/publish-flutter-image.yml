name: Publish IthutePay Flutter web image
on:
  push:
    branches: [main]
    paths:
      - 'apps/flutter_pay/**'
      - '.github/workflows/publish-flutter-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ithutepay-flutter-image
  cancel-in-progress: false
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile, unit test, and publish Flutter web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/flutter_pay
          file: ./apps/flutter_pay/Dockerfile
          push: true
          tags: |
            ghcr.io/ithute-stak/ithute-pay-flutter:latest
            ghcr.io/ithute-stak/ithute-pay-flutter:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
