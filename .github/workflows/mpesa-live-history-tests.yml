name: M-Pesa live history tests

on:
  pull_request:
    paths:
      - 'apps/backend/routers/mpesa_live_testing.py'
      - 'apps/backend/tests/test_mpesa_live_history.py'
      - 'apps/backend/tests/test_mpesa_live_testing_safety.py'
      - '.github/workflows/mpesa-live-history-tests.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/routers/mpesa_live_testing.py'
      - 'apps/backend/tests/test_mpesa_live_history.py'
      - 'apps/backend/tests/test_mpesa_live_testing_safety.py'
      - '.github/workflows/mpesa-live-history-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.txt pytest
      - name: Test live history and live-money safety guards
        working-directory: apps/backend
        run: |
          rm -f tests/paybridge_test.db tests/paybridge_test.db-shm tests/paybridge_test.db-wal
          python -m pytest -q tests/test_mpesa_live_history.py tests/test_mpesa_live_testing_safety.py
