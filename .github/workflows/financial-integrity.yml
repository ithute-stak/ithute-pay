name: IthutePay financial integrity tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/financial-integrity.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/financial-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financial-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financial-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ithute_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: ithute_financial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ithute_test -d ithute_financial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_FINANCIAL_CONCURRENCY_TEST: 'true'
      GOLINK_PG_CONCURRENCY_TEST: 'true'
      DATABASE_URL: postgresql+psycopg://ithute_test:isolated_ci_password@127.0.0.1:5432/ithute_financial_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.txt pytest
      - name: Verify isolated PostgreSQL target
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          assert url.host in {"127.0.0.1", "localhost"}
          assert url.database == "ithute_financial_test"
          assert os.environ["PG_FINANCIAL_CONCURRENCY_TEST"] == "true"
          print("Disposable CI PostgreSQL database verified")
          PY
      - name: Refuse a skipped PostgreSQL concurrency suite
        working-directory: apps/backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          if url.get_backend_name() != "postgresql":
              raise SystemExit("Financial integrity CI must use PostgreSQL")
          # Check the disposable service directly without importing app settings,
          # which are intentionally initialized by pytest's conftest fixture.
          with create_engine(url, connect_args={"connect_timeout": 5}).connect() as connection:
              connection.execute(text("SELECT 1"))
          if os.environ.get("PG_FINANCIAL_CONCURRENCY_TEST") != "true":
              raise SystemExit("PostgreSQL financial concurrency tests must be enabled")
          if os.environ.get("GOLINK_PG_CONCURRENCY_TEST") != "true":
              raise SystemExit("PostgreSQL test session must be enabled")
          print("PostgreSQL financial concurrency suite enabled")
          PY
      - name: Execute financial concurrency tests
        working-directory: apps/backend
        run: |
          python -m pytest -vv -ra --tb=short --durations=10 --junitxml=financial-integrity-results.xml \
            tests/test_postgres_financial_concurrency.py \
            tests/test_financial_integrity_posting.py \
            tests/test_payment_lifecycle.py \
            tests/test_provider_operation_reservation.py \
            tests/test_master_tenant_foundation.py \
            tests/test_tenant_management_api.py \
            tests/test_merchant_network_admin.py \
            tests/test_tenant_portal_access.py \
            tests/test_tenant_reporting.py \
            tests/test_tenant_reconciliation.py \
            tests/test_tenant_reconciliation_cases.py \
            tests/test_tenant_reconciliation_operations.py \
            tests/test_tenant_reconciliation_alerts.py \
            tests/test_tenant_recon_push_worker.py \
            tests/test_tenant_push_operations.py \
            tests/test_tenant_migration_hardening.py \
            tests/test_merchant_payout_dispatch_claim.py \
            tests/test_collection_dispatch_claim.py \
            tests/test_reconciliation_terminal_state.py \
            tests/test_provider_operation_terminal_state.py \
            tests/test_callback_concurrency_contract.py \
            tests/test_payment_fault_injection.py
      - name: Record CI diagnostic context
        if: always()
        run: |
          python --version
          python -m pip show pytest SQLAlchemy psycopg
          echo "GitHub ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
      - name: Upload payment test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-integrity-results
          path: apps/backend/financial-integrity-results.xml
          if-no-files-found: warn
          retention-days: 14
