name: IthutePay staging release preflight

on:
  pull_request:
    paths:
      - 'apps/backend/scripts/staging_preflight.py'
      - 'apps/backend/tests/test_staging_preflight.py'
      - 'docs/staging-release-gate.md'
      - '.github/workflows/staging-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/scripts/staging_preflight.py'
      - 'apps/backend/tests/test_staging_preflight.py'
      - '.github/workflows/staging-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-preflight-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify release manifest validator rejects unsafe scenarios
        working-directory: apps/backend
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -vv --tb=short tests/test_staging_preflight.py
      - name: Refuse missing release evidence
        working-directory: apps/backend
        run: |
          python - <<'PY'
          from scripts.staging_preflight import validate_manifest
          errors = validate_manifest({})
          assert len(errors) >= 10, errors
          print('Missing approval and unsafe defaults correctly block staging')
          PY
