name: IthutePay staging release preflight

on:
  pull_request:
    paths:
      - 'deploy/staging/**'
      - 'apps/backend/scripts/staging_preflight.py'
      - 'apps/backend/tests/test_staging_preflight.py'
      - 'apps/backend/tests/test_staging_compose_contract.py'
      - 'apps/backend/tests/test_staging_supervisor_contract.py'
      - 'apps/backend/tests/test_staging_image_verify_workflow.py'
      - '.github/workflows/staging-image-verify.yml'
      - 'apps/backend/scripts/staging_postdeploy_smoke.py'
      - 'apps/backend/tests/test_staging_postdeploy_smoke.py'
      - 'docs/staging-release-gate.md'
      - '.github/workflows/staging-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/staging/**'
      - 'apps/backend/scripts/staging_preflight.py'
      - 'apps/backend/tests/test_staging_preflight.py'
      - 'apps/backend/tests/test_staging_compose_contract.py'
      - 'apps/backend/tests/test_staging_supervisor_contract.py'
      - 'apps/backend/tests/test_staging_image_verify_workflow.py'
      - '.github/workflows/staging-image-verify.yml'
      - 'apps/backend/scripts/staging_postdeploy_smoke.py'
      - 'apps/backend/tests/test_staging_postdeploy_smoke.py'
      - '.github/workflows/staging-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-preflight-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify release manifest validator rejects unsafe scenarios
        working-directory: apps/backend
        run: |
          python -m pip install pytest PyYAML
          python -m pytest --noconftest -vv --tb=short tests/test_staging_preflight.py tests/test_staging_compose_contract.py tests/test_staging_postdeploy_smoke.py tests/test_staging_supervisor_contract.py tests/test_staging_image_verify_workflow.py
      - name: Refuse missing release evidence
        working-directory: apps/backend
        run: |
          python - <<'PY'
          from scripts.staging_preflight import validate_manifest
          errors = validate_manifest({})
          assert len(errors) >= 10, errors
          print('Missing approval and unsafe defaults correctly block staging')
          PY
      - name: Parse isolated staging Compose without contacting providers or deploying
        run: |
          test "$(docker compose version >/dev/null; echo $?)" -eq 0
          TEMP_ENV="$(mktemp)"
          trap 'rm -f "$TEMP_ENV"' EXIT
          printf '%s\\n' 'SECRET_KEY=offline-dummy-not-a-real-secret-at-least-32-chars' > "$TEMP_ENV"
          export STAGING_IMAGE="ghcr.io/ithute-stak/ithute-pay@sha256:$(printf 'b%.0s' {1..64})"
          export STAGING_ENV_FILE="$TEMP_ENV"
          export STAGING_DB_PASSWORD="offline-ci-placeholder-password"
          docker compose -f deploy/staging/compose.yaml config --quiet
          echo "Isolated staging Compose configuration valid (no containers started)"
