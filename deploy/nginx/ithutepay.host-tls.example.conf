# Host-level Nginx TLS edge template (NOT active until installed).
# The existing Docker Nginx already separates API and portal by Host header.
# Keep Compose's PUBLIC_PORT=8081 bound to loopback via an approved override
# before enabling this configuration. Replace certificates with real paths.
#
# Prerequisites: certificates issued for both hostnames, ports 80/443 free,
# Docker nginx reachable at 127.0.0.1:8081, validate with nginx -t.

server {
    listen 80;
    server_name portal.pay.ithute.co.ls api.pay.ithute.co.ls;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portal.pay.ithute.co.ls;
    ssl_certificate /etc/letsencrypt/live/portal.pay.ithute.co.ls/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.pay.ithute.co.ls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name api.pay.ithute.co.ls;
    ssl_certificate /etc/letsencrypt/live/api.pay.ithute.co.ls/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pay.ithute.co.ls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
